  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#fff; color:var(--text); }
  body {
    min-height:100vh;
    border-top:1px solid #e1e3e8;
    font-family:"Golos UI",Arial,"Helvetica Neue",Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button { font:inherit; }
  .page {
    width:100%;
    padding:66px 10px 72px 12px;
  }
  .banner {
    position:relative;
    height:343px;
    overflow:hidden;
    border-radius:11px;
    background:linear-gradient(90deg,var(--banner-left) 0%,var(--banner-right) 100%);
  }
  .copy {
    position:relative;
    z-index:2;
    padding:82px 84px 0;
    max-width:1110px;
  }
  h1 {
    margin:0;
    font-size:91.5px;
    line-height:1;
    letter-spacing:-3.2px;
    font-weight:800;
    color:#050817;
  }
  .subtitle {
    margin:41px 0 0;
    font-size:46.5px;
    line-height:1.05;
    letter-spacing:-.9px;
    font-weight:400;
    white-space:nowrap;
  }
  .customer-icon {
    position:absolute;
    z-index:1;
    top:22px;
    right:92px;
    width:412px;
    height:320px;
    background-image:var(--icon);
    background-repeat:no-repeat;
    background-size:100% 100%;
    background-position:center;
    pointer-events:none;
    user-select:none;
  }
  .description {
    margin:51px 0 0 2px;
    font-size:26px;
    line-height:1.25;
    font-weight:400;
    color:#11131a;
  }
  .actions {
    margin:48px 0 0 1px;
    display:flex;
    align-items:center;
    gap:32px;
    flex-wrap:wrap;
  }
  .action {
    text-decoration:none;
    height:73px;
    padding:0 32px;
    border:0;
    border-radius:13px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    line-height:1;
    font-weight:700;
    cursor:pointer;
    transition:background-color .15s ease,transform .08s ease;
  }
  .action-primary {
    min-width:535px;
    background:var(--accent);
    color:#fff;
  }
  .action-primary:hover { background:var(--accent-hover); }
  .action-secondary {
    min-width:373px;
    background:#eaf4ff;
    color:#050817;
  }
  .action-secondary:hover { background:#deedfb; }
  .action:active { transform:translateY(1px); }
  .action:focus-visible { outline:3px solid rgba(31,95,173,.28); outline-offset:4px; }

  /* The desktop breakpoint reproduces the supplied 1910×718 reference nearly 1:1. */
  @media (max-width:1500px) {
    .page { padding:48px 10px 56px 10px; }
    .banner { height:270px; }
    .copy { padding:64px 66px 0; max-width:900px; }
    h1 { font-size:80px; letter-spacing:-2.6px; }
    .subtitle { margin-top:31px; font-size:38px; }
    .customer-icon { top:18px; right:70px; width:325px; height:251px; }
    .description { margin-top:37px; font-size:22px; }
    .actions { margin-top:38px; gap:24px; }
    .action { height:58px; border-radius:10px; font-size:23px; padding:0 24px; }
    .action-primary { min-width:420px; }
    .action-secondary { min-width:300px; }
  }
  @media (max-width:900px) {
    .page { padding:24px 12px 44px; }
    .banner { height:330px; }
    .copy { padding:42px 28px 0; max-width:none; }
    h1 { font-size:clamp(52px,10vw,74px); letter-spacing:-2px; }
    .subtitle { margin-top:24px; max-width:76%; white-space:normal; font-size:clamp(28px,5vw,38px); line-height:1.15; }
    .customer-icon { top:auto; right:14px; bottom:0; width:270px; height:209px; }
    .description { margin-top:30px; margin-left:0; font-size:21px; line-height:1.4; }
    .actions { margin-top:30px; margin-left:0; gap:14px; flex-direction:column; align-items:stretch; }
    .action { min-width:0; width:100%; height:60px; font-size:22px; }
  }
  @media (max-width:540px) {
    .banner { height:365px; }
    .subtitle { max-width:100%; }
    .customer-icon { width:235px; height:182px; right:-4px; }
  }
  @media (prefers-reduced-motion:reduce) { .action { transition:none; } }
</style>
</head>
