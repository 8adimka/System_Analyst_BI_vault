# Interactive default is the full-stack developer defined in root AGENTS.md.
# Analyst/reviewer SDK calls set read_only/deny_all explicitly in their isolated view.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[features]
apps = false
plugins = false
memories = false
request_permissions_tool = false
