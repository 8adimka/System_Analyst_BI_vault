:root{--primary:#5294de;--accent:#ffab00;--coral:#f47a55;--ink:#040614;--text:#333;--muted:#767e8d;--line:#ccc;--canvas:#f1f4f7;--menu:#eff2f5;--selected:#dae7f2;--success:#39815b;--danger:#b64139;--header:65px;--side:64px;--drawer:0px;--mode:0px;--focus:#1779d3}

const initial=()=>({version:1,loggedIn:true,origin:1,effective:1,started:null,users:structuredClone(seedUsers),access:structuredClone(baseAccess),logs:[],titles:{},favorites:{},revision:0});
let persistent=true, state;
function valid(s){return s&&s.version===1&&Array.isArray(s.users)&&s.users.some(u=>u.id===s.origin)&&s.users.some(u=>u.id===s.effective)&&Array.isArray(s.logs)&&s.access&&s.titles&&s.favorites;}
try {const s=JSON.parse(localStorage.getItem(KEY)||'null');state=valid(s)?s:initial();localStorage.setItem(KEY,JSON.stringify(state));}catch{state=initial();persistent=false;}
const ui={route:location.hash.slice(1)||'home',drawer:false,menu:false,profile:false,role:'Все',status:'Все',search:'',query:'',favorite:false,event:'Все',logSearch:'',sort:'id',asc:true,editing:false,region:'Все регионы',period:'2026',backFocus:null};
const current=()=>state.users.find(u=>u.id===state.effective);
const original=()=>state.users.find(u=>u.id===state.origin);
const isMode=()=>state.effective!==state.origin;
const isAdmin=()=>state.loggedIn&&current()?.role==='Администратор';
const canEdit=()=>state.loggedIn&&['Аналитик','Администратор'].includes(current()?.role);
const available=()=>!state.loggedIn?[]:isAdmin()?panels:panels.filter(p=>(state.access[current()?.profile]||[]).includes(p.id));
const allowed=id=>available().some(p=>p.id===id);
const titleOf=p=>state.titles[p.id]||p.title;
const initials=u=>u.name.split(' ').map(v=>v[0]).slice(0,2).join('');
const now=()=>new Date().toISOString();
let channel;try{channel=new BroadcastChannel(KEY);}catch{}
function save(){state.revision=Date.now()+Math.random();if(persistent){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{persistent=false;}}try{channel?.postMessage({revision:state.revision,state});}catch{}}
function sync(next){if(!valid(next)||next.revision===state.revision)return;const modeChanged=next.effective!==state.effective||next.loggedIn!==state.loggedIn;state=next;if(modeChanged){ui.drawer=false;ui.profile=false;ui.editing=false;closeModal();route('home',true);toast(state.loggedIn?'Учётная запись обновлена в другой вкладке':'Сеанс завершён в другой вкладке');}else render();}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{sync(JSON.parse(e.newValue));}catch{}}});
if(channel)channel.onmessage=e=>sync(e.data.state);
function log(type,detail='',target=null){state.logs.unshift({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),time:now(),type,actor:original().name,actorLogin:original().login,target:target?.name||'',targetLogin:target?.login||'',detail});state.logs=state.logs.slice(0,500);}
function recordPanelOpen(path){if(!state.loggedIn||!path.startsWith('report/'))return;const p=panels.find(p=>p.id===path.split('/')[1]);if(p&&allowed(p.id)){log('Открытие панели',titleOf(p));save();}}
function route(path,replace=false){recordPanelOpen(path);ui.route=path;ui.editing=false;ui.profile=false;ui.menu=false;const hash='#'+path;if(location.hash!==hash){if(replace)history.replaceState(null,'',hash);else history.pushState(null,'',hash);}render();$('.main')?.scrollTo(0,0);}
window.addEventListener('popstate',()=>{ui.route=location.hash.slice(1)||'home';ui.editing=false;recordPanelOpen(ui.route);render();});
function toast(message,error=false){const t=document.createElement('div');t.className='toast'+(error?' error':'');t.setAttribute('role',error?'alert':'status');t.innerHTML=icon(error?'info':'check')+`<span>${esc(message)}</span>`+ib('close','Закрыть сообщение','dismiss-toast');$('#toasts').replaceChildren(t);setTimeout(()=>t.remove(),error?10000:6500);}
function accountReason(u){if(u.state!=='Активен')return 'Учётная запись неактивна.';if(u.lock)return u.lock==='Временно заблокирован'?'Учётная запись временно заблокирована.':'Учётная запись заблокирована.';if(u.expiry&&u.expiry<new Date().toISOString().slice(0,10))return 'Срок действия учётной записи истёк.';return '';}
function enter(id){if(!isAdmin()){toast('Недостаточно прав для входа под пользователем.',true);return false;}const u=state.users.find(v=>v.id===id);if(!u){toast('Учётная запись не найдена.',true);return false;}const reason=accountReason(u);if(reason){toast(`Не удалось войти под пользователем «${u.name}». ${reason}`,true);return false;}if(u.id===state.effective)return false;
 if(isMode())log('Завершение имперсонализации','Переключение пользователя',current());
 state.effective=state.origin;state.started=null;
 if(id!==state.origin){state.effective=id;state.started=now();log('Начало имперсонализации','Вход под пользователем',u);}
 save();ui.drawer=false;ui.query='';ui.favorite=false;route('home');toast(id===state.origin?'Вы вернулись к своей учётной записи':`Вы вошли под пользователем «${u.name}»`);return true;
}
function returnToSelf(){if(!state.loggedIn||!isMode())return;log('Завершение имперсонализации','Возврат к своей учётной записи',current());state.effective=state.origin;state.started=null;save();ui.drawer=false;ui.query='';ui.favorite=false;route('home');toast('Вы вернулись к своей учётной записи');}
function logout(){if(!state.loggedIn)return;if(isMode())log('Завершение имперсонализации','Выход из портала',current());log('Выход','Сеанс портала завершён');state.loggedIn=false;state.effective=state.origin;state.started=null;save();ui.drawer=false;closeModal();route('home');}
function login(){state.loggedIn=true;state.effective=state.origin;state.started=null;save();route('home');toast('Выполнен вход в демонстрационную учётную запись администратора');}
function header(){return `<header class="gisp-header"><button class="gisp-brand" data-action="home" title="Главная страница"><img src="${LOGO}" alt="ГИСП"><span>Государственная информационная система промышленности</span></button><div class="head-right"><span class="demo-label">Макет · демонстрационные данные</span><button class="head-user" data-action="profile" aria-expanded="${ui.profile}" aria-controls="profile-menu"><span class="avatar">${initials(original())}</span><span class="user-name">${esc(original().name)}</span>${icon('down')}</button></div></header>${ui.profile?`<div class="profile-menu" id="profile-menu"><div class="identity"><strong>${esc(original().name)}</strong><small>Учётная запись ГИСП · ${esc(original().login)}</small></div>${isMode()?`<button data-action="drawer">${icon('enter')}Работа от имени ${esc(current().name)}</button><button data-action="return">${icon('back')}Вернуться к своей учётной записи</button>`:''}<button data-action="about">${icon('info')}О макете</button><button data-action="logout">${icon('logout')}Выход</button></div>`:''}`;}
function side(){const settings=['users','journal','profiles'].includes(ui.route)&&isAdmin();if(settings)return `<nav class="sidebar settings-shell" aria-label="Навигация портала"><div class="settings-brand"><img src="${MODUS}" alt="Modus BI"></div>${nav('grid','Аналитические панели','home',false)}<div class="nav-section">Настройки</div>${nav('users','Пользователи','users',ui.route==='users')}${nav('settings','Профили пользователей','profiles',ui.route==='profiles')}${nav('journal','Журнал','journal',ui.route==='journal')}<div class="bottom">${nav('user','Учётная запись','profile',false)}${nav('logout','Выход','logout',false)}</div><div class="version">Аналитический портал</div></nav>`;
 return `<nav class="sidebar" aria-label="Навигация портала"><div class="rail-logo"><img src="${RAIL}" alt="ГИСП"><span class="nav-label">Аналитический<br>портал</span></div>${nav('menu','Меню','toggle-menu',false)}${nav('grid','Аналитические панели','home',ui.route==='home')}<div class="bottom">${isAdmin()?nav('settings','Настройки · Пользователи','users',false):''}${nav('user','Учётная запись','profile',false)}${nav('logout','Выход','logout',false)}</div></nav>`;
}
function nav(i,label,action,active){return `<button class="rail-btn${active?' active':''}" data-action="${action}" title="${label}" aria-label="${label}"${active?' aria-current="page"':''}>${icon(i)}<span class="nav-label">${label}</span></button>`;}
function modebar(){return !isMode()?'':`<div class="modebar"><button class="mode-chip" data-action="drawer" aria-expanded="${ui.drawer}" aria-controls="impersonation-panel" title="Сведения об имперсонализации"><span class="dot"></span>${icon('enter')}<span class="mode-word">Работа от имени</span><strong>${esc(current().name)}</strong>${icon(ui.drawer?'close':'chevron')}</button><button class="btn return" data-action="return" title="Вернуться к своей учётной записи" aria-label="Вернуться к своей учётной записи">${icon('back')}Вернуться к своей учётной записи</button></div>`;}
function person(u,selected=false){return `<div class="person${selected?' selected':''}"><div class="avatar">${initials(u)}</div><div><strong>${esc(u.name)}</strong><small>${esc(u.login)}</small><span class="role">${esc(u.role)}</span></div></div>`;}
function drawer(){return `<aside class="info-drawer" id="impersonation-panel" aria-label="Сведения об имперсонализации" ${!ui.drawer||!isMode()?'hidden':''}><div class="drawer-head"><h2>Имперсонализация</h2>${ib('close','Свернуть панель','drawer')}</div><div class="identity-label">Исходный администратор</div>${person(original())}<div class="identity-arrow">${icon('down')}</div><div class="identity-label">Выбранный пользователь</div>${person(current(),true)}<div class="drawer-section"><h3>Доступ на портале</h3><div class="count-line"><span>Аналитические панели</span><strong>${available().length}</strong></div><div class="count-line"><span>Пользователи и настройки</span><strong>${isAdmin()?'Доступны':'Недоступны'}</strong></div><div class="count-line"><span>Изменение панелей</span><strong>${canEdit()?'Доступно':'Недоступно'}</strong></div></div><div class="drawer-note">Применяются текущие настройки доступа портала и сохранённые сведения о пользователе. Разрешённые изменения сохраняются.</div><div class="drawer-section"><p>Действия в журнале выполняет ${esc(original().name)}.</p><p>Вход выполнен: ${state.started?new Date(state.started).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'—'}</p><button class="btn primary" data-action="return">${icon('back')}Вернуться к своей учётной записи</button></div></aside>`;}
function home(){const visible=available(),favorites=state.favorites[state.effective]||[];const list=visible.filter(p=>(!ui.favorite||favorites.includes(p.id))&&titleOf(p).toLocaleLowerCase('ru').includes(ui.query.toLocaleLowerCase('ru')));const groups=[...new Set(list.map(p=>p.group))];return `<section class="home"><div class="home-top"><h1>Аналитические панели</h1><div class="home-tools"><label class="searchbox">${icon('search')}<input id="panel-search" type="search" placeholder="Поиск аналитической панели" aria-label="Поиск аналитической панели" value="${esc(ui.query)}"></label></div></div><div class="catalog-tabs"><button data-action="all-panels" class="${!ui.favorite?'active':''}">Все панели <span class="number">${visible.length}</span></button><button data-action="favorites" class="${ui.favorite?'active':''}">${icon('star')}Избранное <span class="number">${visible.filter(p=>favorites.includes(p.id)).length}</span></button></div><div class="catalog-body" id="catalog-results">${list.length?groups.map(group=>`<section><h2>${esc(group)}</h2><div class="report-cards">${list.filter(p=>p.group===group).map(p=>`<article class="report-card"><button class="card-main" data-action="open-report" data-id="${p.id}" aria-label="Открыть панель ${esc(titleOf(p))}"><strong>${esc(titleOf(p))}</strong><small>${p.subtitle}</small><img src="${PREVIEW}" alt=""></button><button class="iconbtn star${favorites.includes(p.id)?' on':''}" data-action="star" data-id="${p.id}" aria-label="${favorites.includes(p.id)?'Убрать из избранного':'Добавить в избранное'}: ${esc(titleOf(p))}" title="${favorites.includes(p.id)?'Убрать из избранного':'Добавить в избранное'}" aria-pressed="${favorites.includes(p.id)}">${icon('star')}</button></article>`).join('')}</div></section>`).join(''):`<div class="empty">${icon('grid')}<h2>${!visible.length?'Нет доступных аналитических панелей':ui.favorite&&!ui.query?'В избранном пока нет панелей':'Ничего не найдено'}</h2><p>${!visible.length?'Для этой учётной записи не назначен доступ к аналитическим панелям.':ui.favorite&&!ui.query?'Отметьте нужную панель звёздочкой.':'Попробуйте изменить поисковый запрос.'}</p></div>`}<p class="catalog-foot">Аналитический портал · демонстрационные данные</p></div></section>`;}
function selectOptions(items,value){return items.map(x=>`<option value="${esc(x)}"${value===x?' selected':''}>${esc(x)}</option>`).join('');}
function userRows(){let users=state.users.filter(u=>(ui.role==='Все'||u.role===ui.role)&&(ui.status==='Все'||u.state===ui.status)&&[u.id,u.login,u.name,u.org].join(' ').toLocaleLowerCase('ru').includes(ui.search.toLocaleLowerCase('ru')));users.sort((a,b)=>{const v=ui.sort==='id'?a.id-b.id:String(a[ui.sort]).localeCompare(String(b[ui.sort]),'ru');return ui.asc?v:-v;});return users;}
function usersPage(){return `<section class="settings-page"><div class="page-head"><h1>Настройки <span>→</span> Пользователи</h1><button class="btn secondary" data-action="add-user">Добавить пользователя</button></div><div class="filters"><div class="filter"><label for="role-filter">Роль</label><select id="role-filter">${selectOptions(['Все','Администратор','Аналитик','Пользователь'],ui.role)}</select></div><div class="filter"><label for="status-filter">Статус</label><select id="status-filter">${selectOptions(['Все','Активен','Неактивен'],ui.status)}</select></div><label class="searchbox">${icon('search')}<input id="user-search" type="search" placeholder="Поиск" aria-label="Поиск пользователей" value="${esc(ui.search)}"></label></div><div id="user-results">${usersTable()}</div><div class="legend">${icon('enter')}Наведите на иконку пользователя в колонке «Операции», чтобы увидеть подсказку.</div></section>`;}

о</td></tr>'}</tbody></table></div><div class="table-caption"><span>Пользователей: ${rows.length} из ${state.users.length}</span><span>Все учётные записи и данные в макете вымышлены</span></div>`;}
function journalPage(){const logs=state.logs.filter(l=>(ui.event==='Все'||l.type===ui.event)&&[l.actor,l.actorLogin,l.target,l.detail].join(' ').toLocaleLowerCase('ru').includes(ui.logSearch.toLocaleLowerCase('ru')));return `<section class="settings-page"><div class="page-head"><h1>Настройки <span>→</span> Журнал</h1></div><div class="filters"><div class="filter"><label for="event-filter">Тип события</label><select id="event-filter">${selectOptions(['Все','Начало имперсонализации','Завершение имперсонализации','Открытие панели','Изменение панели','Изменение пользователя','Изменение профиля','Выход'],ui.event)}</select></div><label class="searchbox">${icon('search')}<input id="log-search" type="search" value="${esc(ui.logSearch)}" placeholder="Поиск по журналу" aria-label="Поиск по журналу"></label></div><div class="table-scroll"><table class="journal-table"><thead><tr><th>Дата и время</th><th>Тип события</th><th>Пользователь</th><th>Выбранная учётная запись</th><th>Описание</th></tr></thead><tbody>${logs.length?logs.map(l=>`<tr><td>${new Date(l.time).toLocaleString('ru-RU')}</td><td><span class="event-tag${l.type==='Начало имперсонализации'?' start':l.type==='Завершение имперсонализации'?' end':''}">${esc(l.type)}</span></td><td>${esc(l.actor)}<small>${esc(l.actorLogin)}</small></td><td>${esc(l.target||'—')}${l.target?`<small>${esc(l.targetLogin)}</small>`:''}</td><td>${esc(l.detail)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Событий не найдено</td></tr>'}</tbody></table></div><p class="form-hint" style="margin-top:16px">Журнал показывает события этого макета. Начало и завершение режима фиксируются отдельно. Действия выполняет исходный администратор.</p></section>`;}
function profilesPage(){return `<section class="settings-page"><div class="page-head"><h1>Настройки <span>→</span> Профили пользователей</h1></div><p class="muted small">Доступ к аналитическим панелям для сохранённых профилей пользователей.</p><div class="table-scroll"><table class="journal-table"><thead><tr><th>Профиль</th><th>Аналитические панели</th><th>Операции</th></tr></thead><tbody>${profileNames.map(name=>`<tr><td>${esc(name)}</td><td>${(state.access[name]||[]).map(id=>esc(titleOf(panels.find(p=>p.id===id)))).join(', ')||'Нет доступных панелей'}</td><td>${ib('edit','Редактировать профиль','edit-profile',`data-id="${name}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function reportPage(id){const p=panels.find(p=>p.id===id);if(!p||!allowed(id))return denied();const values=ui.region==='Все регионы'?[24.8,126,86]:ui.region==='Центральный ФО'?[9.6,48,33]:[15.2,78,53];const prev=ui.period==='2025';return `<section class="report-page"><div class="report-toolbar"><div class="report-title">${ib('back','К аналитическим панелям','home')}${ui.editing?`<input id="report-title-input" aria-label="Название аналитической панели" maxlength="90" value="${esc(titleOf(p))}">`:`<h1>${esc(titleOf(p))}</h1>`}</div><div class="report-ops">${ui.editing?`<button class="btn primary" data-action="save-report" data-id="${id}">${icon('save')}Сохранить</button><button class="btn" data-action="cancel-edit">Отмена</button>`:canEdit()?`<button class="btn link" data-action="edit-report">${icon('edit')}Редактировать</button>`:''}${!ui.editing?`<button class="btn link" data-action="report-info">${icon('info')}О панели</button>`:''}</div></div>${ui.editing?'<div class="editing-note">Редактирование аналитической панели. Измените название и нажмите «Сохранить».</div>':''}<div class="report-tabs"><span>Обзор</span></div><div class="dashboard"><div class="dashboard-filter"><label for="region-filter">Регион</label><select id="region-filter">${selectOptions(['Все регионы','Центральный ФО','Приволжский ФО'],ui.region)}</select><label for="period-filter">Год</label><select id="period-filter">${selectOptions(['2026','2025'],ui.period)}</select><button class="btn link small" data-action="reset-filters">Сбросить</button><span class="period">Демонстрационные показатели</span></div><div class="kpis"><div class="kpi"><div class="label">Объём поддержки</div><span class="trend">↗ 12,4%</span><div class="value">${(values[0]*(prev?.82:1)).toFixed(1).replace('.',',')} <small>млрд ₽</small></div></div><div class="kpi"><div class="label">Проекты</div><span class="trend">↗ 8,6%</span><div class="value">${Math.round(values[1]*(prev?.86:1))} <small>ед.</small></div></div><div class="kpi"><div class="label">Получатели поддержки</div><span class="trend">↗ 6,2%</span><div class="value">${Math.round(values[2]*(prev?.88:1))} <small>организаций</small></div></div></div><div class="charts"><div class="chart-box"><h2>Динамика финансирования, млрд ₽</h2>${chart(prev)}<div class="chart-legend"><span><i></i>Объём финансирования</span><span><i style="background:#9bb57f"></i>Предыдущий год</span></div></div><div class="chart-box"><h2>Распределение по направлениям</h2>${[['Машиностроение',76,'9,2'],['Химическая отрасль',57,'7,1'],['Металлургия',40,'4,8'],['Прочие',29,'3,7']].map(([name,width,value])=>`<div class="bar-line"><span>${name}</span><div class="bar-track"><span style="width:${width}%"></span></div><strong>${value}</strong></div>`).join('')}</div></div><div class="dataset"><h2>Проекты и получатели поддержки</h2><table><thead><tr><th>Проект</th><th>Регион</th><th>Направление</th><th class="num">Поддержка, млн ₽</th><th>Статус</th></tr></thead><tbody>${projectRows(prev)}</tbody></table></div></div></section>`;}
function chart(previous){const heights=previous?[38,48,41,65,74,87,82,100,114,103,128,137]:[42,58,51,77,89,101,92,116,130,122,142,157];return `<svg class="chart-svg" viewBox="0 0 600 185" role="img" aria-label="Динамика финансирования по месяцам"><g stroke="#e8edf2" stroke-width="1"><path d="M35 20H590M35 60H590M35 100H590M35 140H590M35 165H590"/></g><g fill="#97a2b1" font-size="9" font-family="Arial"><text x="5" y="24">8,0</text><text x="5" y="64">6,0</text><text x="5" y="104">4,0</text><text x="5" y="144">2,0</text></g>${heights.map((h,i)=>`<rect x="${44+i*45}" y="${165-h*.8}" width="13" height="${h*.8}" fill="#5c88ae"/><rect x="${59+i*45}" y="${165-h*.59}" width="13" height="${h*.59}" fill="#9bb57f"/><text x="${47+i*45}" y="181" fill="#95a0af" font-size="9" font-family="Arial">${['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][i]}</text>`).join('')}</svg>`;}
function projectRows(prev){const rows=[['Модернизация производства','Центральный ФО','Машиностроение',480],['Развитие производственной линии','Приволжский ФО','Химическая отрасль',320],['Новые производственные мощности','Центральный ФО','Металлургия',650],['Технологическое обновление','Приволжский ФО','Машиностроение',210],['Расширение выпуска продукции','Центральный ФО','Прочие',165]];return rows.filter(r=>ui.region==='Все регионы'||r[1]===ui.region).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="num">${Math.round(r[3]*(prev?.8:1)).toLocaleString('ru-RU')}</td><td class="project-status">В реализации</td></tr>`).join('');}
function denied(){return `<section class="denied"><div>${icon('lock')}<h1>Доступ ограничен</h1><p>У текущей учётной записи нет доступа к этому разделу или панели.</p><button class="btn primary" data-action="home">На главную</button></div></section>`;}
function render(){const settings=['users','journal','profiles'].includes(ui.route)&&isAdmin();document.body.classList.toggle('settings',settings);document.body.classList.toggle('impersonating',state.loggedIn&&isMode());document.body.classList.toggle('menu-expanded',ui.menu&&!settings);document.documentElement.style.setProperty('--drawer',ui.drawer&&isMode()?'350px':'0px');if(!state.loggedIn){$('#app').innerHTML=`<main class="login-screen"><div class="login-card"><img src="${LOGO}" alt="ГИСП"><h1>Сеанс завершён</h1><p>Вы вышли из аналитического портала.<br>Для продолжения работы выполните вход.</p><button class="btn primary" data-action="login">Войти в демонстрационный портал</button><p class="small">Вход откроет учётную запись администратора<br>Алексей Смирнов · a.smirnov</p></div></main>`;return;}
 let page;if(ui.route==='home')page=home();else if(['users','journal','profiles'].includes(ui.route))page=isAdmin()?(ui.route==='users'?usersPage():ui.route==='journal'?journalPage():profilesPage()):denied();else if(ui.route.startsWith('report/'))page=reportPage(ui.route.split('/')[1]);else page=denied();
 $('#app').innerHTML=header()+side()+`<div class="workspace">${modebar()}<div class="work-row"><main class="main" id="main-content">${page}</main>${drawer()}</div></div>`;
}
const modal=$('#modal');
function closeModal(){if(modal.open)modal.close();}
function showModal(title,body,actions){ui.backFocus=document.activeElement;modal.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2>${ib('close','Закрыть диалог','close-modal')}</div><div class="dialog-body">${body}</div><div class="dialog-actions">${actions||'<button class="btn primary" data-action="close-modal">Понятно</button>'}</div>`;modal.showModal();}
modal.addEventListener('close',()=>{if(ui.backFocus?.isConnected)ui.backFocus.focus();});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
function editUser(id){if(!isAdmin())return;const u=state.users.find(u=>u.id===id);const adding=!u;showModal(adding?'Добавить пользователя':'Редактировать пользователя',`<form id="user-form"><div class="form-row"><label for="edit-login">Логин</label><input id="edit-login" value="${esc(u?.login||'')}" maxlength="50" ${!adding?'disabled':''} required></div><div class="form-row"><label for="edit-name">Ф.И.О.</label><input id="edit-name" value="${esc(u?.name||'')}" maxlength="80" required></div><div class="form-row"><label for="edit-role">Роль</label><select id="edit-role" ${u&&[state.origin,state.effective].includes(u.id)?'disabled':''}>${selectOptions(['Пользователь','Аналитик','Администратор'],u?.role||'Пользователь')}</select></div><div class="form-row"><label for="edit-user-profile">Профиль</label><select id="edit-user-profile">${selectOptions(profileNames,u?.profile||'Сотрудники')}</select></div><div class="form-row"><label for="edit-state">Статус</label><select id="edit-state" ${u&&[state.origin,state.effective].includes(u.id)?'disabled':''}>${selectOptions(['Активен','Неактивен'],u?.state||'Активен')}</select></div><div class="preview-permissions" id="edit-access-preview"></div><p class="form-hint" style="margin-top:14px">Профиль определяет доступ к панелям. Изменение настроек портала учитывается при следующем входе под пользователем.</p><div class="field-error" id="user-error" role="alert"></div></form>`,`<button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="save-user" data-id="${id||0}">Сохранить</button>`);previewAccess();}
function previewAccess(){if(!$('#edit-access-preview'))return;const role=$('#edit-role').value,profile=$('#edit-user-profile').value;const ids=role==='Администратор'?panels.map(p=>p.id):state.access[profile]||[];$('#edit-access-preview').innerHTML=`<strong>Доступные аналитические панели: ${ids.length}</strong>${ids.map(id=>esc(titleOf(panels.find(p=>p.id===id)))).join('<br>')||'Нет доступных панелей'}`;}
function saveUser(id){if(!isAdmin())return;const login=$('#edit-login').value.trim(),name=$('#edit-name').value.trim();if(!login||!name){$('#user-error').textContent='Укажите логин и Ф.И.О.';return;}if(!id&&state.users.some(u=>u.login.toLowerCase()===login.toLowerCase())){$('#user-error').textContent='Пользователь с таким логином уже существует.';return;}if(!id&&!/^[a-zA-Z0-9._@-]+$/.test(login)){$('#user-error').textContent='В логине допустимы латинские буквы, цифры, точка, дефис, _ и @.';return;}const u=state.users.find(u=>u.id===id);if(u){u.name=name;u.profile=$('#edit-user-profile').value;if(![state.origin,state.effective].includes(id)){u.role=$('#edit-role').value;u.state=$('#edit-state').value;}}else state.users.push({id:Math.max(...state.users.map(x=>x.id))+1,login,name,role:$('#edit-role').value,profile:$('#edit-user-profile').value,state:$('#edit-state').value,lock:'',expiry:'',org:'Демо-организация'});log('Изменение пользователя',`${id?'Изменена':'Создана'} учётная запись ${login}`);save();closeModal();render();toast('Настройки пользователя сохранены в макете');}
function editProfile(name){if(!isAdmin()||!profileNames.includes(name))return;showModal('Профиль: '+esc(name),`<p class="muted small">Выберите доступные аналитические панели.</p><form id="profile-form">${panels.map(p=>`<label style="display:flex;align-items:center;gap:10px;margin:13px 0"><input type="checkbox" name="panel" value="${p.id}" ${(state.access[name]||[]).includes(p.id)?'checked':''} style="accent-color:#5294de;width:16px;height:16px">${esc(titleOf(p))}</label>`).join('')}</form><p class="form-hint">При следующем входе под пользователем этого профиля применятся новые настройки доступа портала.</p>`,`<button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="save-profile" data-id="${name}">Сохранить</button>`);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case 'home':route('home');break;
 case 'users':case 'journal':case 'profiles':if(isAdmin())route(a);else toast('Доступ запрещён.',true);break;
 case 'toggle-menu':ui.menu=!ui.menu;render();break;
 case 'profile':ui.profile=!ui.profile;render();if(ui.profile)$('#profile-menu button')?.focus();else $('.head-user')?.focus();break;
 case 'drawer':if(isMode()){ui.drawer=!ui.drawer;ui.profile=false;render();if(ui.drawer)$('#impersonation-panel button')?.focus();else $('.mode-chip')?.focus();}break;
 case 'enter':enter(Number(id));break;
 case 'return':returnToSelf();break;
 case 'logout':logout();break;
 case 'login':login();break;
 case 'dismiss-toast':b.closest('.toast').remove();break;
 case 'all-panels':ui.favorite=false;render();break;
 case 'favorites':ui.favorite=true;render();break;
 case 'star':if(!allowed(id))break;{const set=new Set(state.favorites[state.effective]||[]);if(set.has(id))set.delete(id);else set.add(id);state.favorites[state.effective]=[...set];save();render();}break;
 case 'open-report':if(!allowed(id)){toast('Нет доступа к панели.',true);break;}route('report/'+id);break;
 case 'sort-users':ui.asc=ui.sort===id?!ui.asc:true;ui.sort=id;$('#user-results').innerHTML=usersTable();break;
 case 'add-user':editUser(0);break;
 case 'edit-user':editUser(Number(id));break;
 case 'save-user':saveUser(Number(id));break;
 case 'delete-user':if(!isAdmin()||[state.origin,state.effective].includes(Number(id)))break;{const u=state.users.find(x=>x.id===Number(id));if(u)showModal('Удалить пользователя?',`<p>Учётная запись <strong>${esc(u.name)}</strong> (${esc(u.login)}) будет удалена из макета.</p>`,`<button class="btn" data-action="close-modal">Отмена</button><button class="btn danger" data-action="confirm-delete" data-id="${id}">Удалить</button>`);}break;
 case 'confirm-delete':if(!isAdmin()||[state.origin,state.effective].includes(Number(id)))break;{const u=state.users.find(x=>x.id===Number(id));if(u){log('Изменение пользователя','Удалена учётная запись '+u.login);state.users=state.users.filter(x=>x.id!==u.id);save();closeModal();render();toast('Пользователь удалён из макета');}}break;
 case 'edit-profile':editProfile(id);break;
 case 'save-profile':if(isAdmin()&&profileNames.includes(id)){state.access[id]=$$('#profile-form input:checked').map(x=>x.value);log('Изменение профиля','Изменён доступ к панелям: '+id);save();closeModal();render();toast('Настройки профиля сохранены в макете');}break;
 case 'edit-report':if(canEdit()&&allowed(ui.route.split('/')[1])){ui.editing=true;render();$('#report-title-input')?.focus();}break;
 case 'cancel-edit':ui.editing=false;render();break;
 case 'save-report':if(!canEdit()||!allowed(id))break;{const title=$('#report-title-input')?.value.trim();if(!title){toast('Укажите название аналитической панели.',true);break;}state.titles[id]=title;log('Изменение панели','Сохранено название панели: '+title);save();ui.editing=false;render();toast('Изменения аналитической панели сохранены в макете');}break;
 case 'reset-filters':ui.region='Все регионы';ui.period='2026';render();break;
 case 'report-info':showModal('Об аналитической панели',`<p>Текущая учётная запись: <strong>${esc(current().name)}</strong>.</p><p>Роль: ${esc(current().role)}. ${canEdit()?'Изменение панели разрешено.':'Доступен просмотр панели.'}</p><p class="form-hint">Показатели и проекты вымышлены и используются для демонстрации интерфейса.</p>`);break;
 case 'about':ui.profile=false;render();showModal('О функциональном макете',`<p>Вход под пользователем с вкладки «Пользователи», применение его прав и возврат к исходному администратору.</p><ul class="about-list"><li>Анна Волкова — пользователь с двумя панелями.</li><li>Мария Соколова — аналитик с возможностью изменить название доступной панели.</li><li>Дмитрий Орлов — администратор, через которого можно переключиться на третьего пользователя.</li><li>Илья Лебедев — пользователь без доступа к панелям.</li><li>Остальные записи показывают причины отказа во входе.</li></ul><p class="form-hint">Автономный HTML на вымышленных данных. Изменения хранятся только в браузере; вкладки этого файла используют общую демонстрационную сессию. Реальная авторизация, серверные проверки и интеграции отсутствуют. Доработка AD в сценарий не входит.</p><p class="form-hint">Оформление основано на исходниках ФРП. Внешняя шапка ГИСП воссоздана приблизительно, так как её действующий внешний скрипт не подключается.</p>`,`<button class="btn link" data-action="reset-demo">Начать демонстрацию заново</button><button class="btn primary" data-action="close-modal">Понятно</button>`);break;
 case 'reset-demo':showModal('Начать заново?',`<p>Изменения демонстрационных пользователей, профилей, панелей и журнал этого макета будут сброшены. Откроется главная страница администратора.</p>`,`<button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-reset">Начать заново</button>`);break;
 case 'confirm-reset':state=initial();save();Object.assign(ui,{drawer:false,role:'Все',status:'Все',search:'',query:'',favorite:false,event:'Все',logSearch:''});closeModal();route('home');toast('Демонстрация начата заново');break;
 case 'close-modal':closeModal();break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='user-search'){ui.search=e.target.value;$('#user-results').innerHTML=usersTable();}if(e.target.id==='panel-search'){ui.query=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=home();$('#catalog-results').innerHTML=$('#catalog-results',tmp).innerHTML;}if(e.target.id==='log-search'){ui.logSearch=e.target.value;const start=e.target.selectionStart;render();$('#log-search').focus();$('#log-search').setSelectionRange(start,start);}});
document.addEventListener('change',e=>{switch(e.target.id){case 'role-filter':ui.role=e.target.value;$('#user-results').innerHTML=usersTable();break;case 'status-filter':ui.status=e.target.value;$('#user-results').innerHTML=usersTable();break;case 'event-filter':ui.event=e.target.value;render();break;case 'region-filter':ui.region=e.target.value;render();break;case 'period-filter':ui.period=e.target.value;render();break;case 'edit-role':case 'edit-user-profile':previewAccess();break;}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='user-form')$('#modal [data-action="save-user"]')?.click();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.open){e.preventDefault();closeModal();return;}if(e.key==='Escape'&&!modal.open){if(ui.profile){ui.profile=false;render();$('.head-user')?.focus();}else if(ui.drawer){ui.drawer=false;render();$('.mode-chip')?.focus();}else if(ui.menu){ui.menu=false;render();}}});
document.addEventListener('pointerdown',e=>{if(ui.profile&&!e.target.closest('.profile-menu')&&!e.target.closest('.head-user')){ui.profile=false;$('.profile-menu')?.remove();$('.head-user')?.setAttribute('aria-expanded','false');}});
recordPanelOpen(ui.route);
render();
if(!persistent)setTimeout(()=>toast('Браузер ограничил локальное хранилище. Режим сохранится только до закрытия страницы.',true),300);
})();

</script>
